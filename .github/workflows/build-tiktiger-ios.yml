name: Build and Verify Tiktiger 1.1 iOS dylib

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tiktiger_1.1/Xcode_Dylib_Project/**'
      - 'Tiktiger_1.1/TiktigerHost/**'
      - '.github/workflows/build-tiktiger-ios.yml'

permissions:
  contents: read

concurrency:
  group: tiktiger-ios-dylib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tiktiger-dylib:
    name: Release iphoneos arm64 dylib
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Legacy active-reference guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_legacy_active_references.py

      - name: Inspect Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Build Tiktiger.dylib with Xcode
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/Tiktiger_1.1/Xcode_Dylib_Project"
          PROJECT="$PROJECT_DIR/TiktigerDylib.xcodeproj"
          DERIVED_DATA="$PROJECT_DIR/Build/.DerivedData"
          OUTPUT_DIR="$PROJECT_DIR/BuildOutput"
          SETTINGS_FILE="$PROJECT_DIR/Build/dylib-build-settings.txt"

          rm -rf "$DERIVED_DATA"
          mkdir -p "$OUTPUT_DIR" "$PROJECT_DIR/Build"
          rm -f "$OUTPUT_DIR/Tiktiger.dylib"

          xcodebuild \
            -project "$PROJECT" \
            -scheme TiktigerDylib \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          grep -q 'BUILD SUCCEEDED' "$GITHUB_WORKSPACE/build.log"

          xcodebuild \
            -project "$PROJECT" \
            -scheme TiktigerDylib \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -showBuildSettings > "$SETTINGS_FILE"

          TARGET_BUILD_DIR="$(sed -n 's/^[[:space:]]*TARGET_BUILD_DIR = //p' "$SETTINGS_FILE" | tail -n 1)"
          EXECUTABLE_PATH="$(sed -n 's/^[[:space:]]*EXECUTABLE_PATH = //p' "$SETTINGS_FILE" | tail -n 1)"
          test -n "$TARGET_BUILD_DIR"
          test -n "$EXECUTABLE_PATH"

          REAL_DYLIB="$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
          case "$REAL_DYLIB" in
            *.dSYM/*) echo 'Refusing dSYM companion path'; exit 1 ;;
          esac
          test -f "$REAL_DYLIB"
          test -s "$REAL_DYLIB"
          printf 'TARGET_BUILD_DIR=%s\nEXECUTABLE_PATH=%s\nREAL_DYLIB=%s\n' \
            "$TARGET_BUILD_DIR" "$EXECUTABLE_PATH" "$REAL_DYLIB" \
            > "$GITHUB_WORKSPACE/dylib_product_path.txt"

      - name: Verify dylib product and generate evidence before Host build
        shell: bash
        run: |
          set -uo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/Tiktiger_1.1/Xcode_Dylib_Project"
          OUTPUT_DIR="$PROJECT_DIR/BuildOutput"
          VERIFICATION="$GITHUB_WORKSPACE/verification.txt"
          SYMBOL_STATUS_FILE="$GITHUB_WORKSPACE/symbol_status.txt"
          REAL_DYLIB="$(sed -n 's/^REAL_DYLIB=//p' "$GITHUB_WORKSPACE/dylib_product_path.txt")"
          OUTPUT="$REAL_DYLIB"
          VERIFY_STATUS=0

          FILE_RESULT='NOT RUN'
          LIPO_RESULT='NOT RUN'
          ARCH_LIST='NOT RUN'
          OTOOL_HV_RESULT='NOT RUN'
          OTOOL_D_RESULT='NOT RUN'
          OTOOL_L_RESULT='NOT RUN'
          SYMBOL_RESULT='NOT RUN'
          SHA256_RESULT='NOT RUN'

          if ! test -f "$OUTPUT"; then VERIFY_STATUS=1; fi
          if ! test -s "$OUTPUT"; then VERIFY_STATUS=1; fi
          case "$REAL_DYLIB" in
            *.dSYM/*) VERIFY_STATUS=1 ;;
          esac

          if FILE_RESULT="$(file "$OUTPUT" 2>&1)"; then :; else VERIFY_STATUS=1; fi
          if grep -Eiq 'dSYM companion' <<< "$FILE_RESULT"; then VERIFY_STATUS=1; fi
          if grep -Eiq 'Mach-O' <<< "$FILE_RESULT"; then :; else VERIFY_STATUS=1; fi

          if LIPO_RESULT="$(lipo -info "$OUTPUT" 2>&1)"; then :; else VERIFY_STATUS=1; fi
          if ARCH_LIST="$(lipo -archs "$OUTPUT" 2>&1)"; then :; else VERIFY_STATUS=1; fi
          if grep -Eiq 'arm64' <<< "$LIPO_RESULT"; then :; else VERIFY_STATUS=1; fi
          if test "$ARCH_LIST" = 'arm64'; then :; else VERIFY_STATUS=1; fi

          if OTOOL_HV_RESULT="$(otool -hv "$OUTPUT" 2>&1)"; then :; else VERIFY_STATUS=1; fi
          if grep -Eiq 'MH_DYLIB' <<< "$OTOOL_HV_RESULT"; then
            :
          elif grep -Eiq '^[[:space:]]*MH_MAGIC_64.*DYLIB' <<< "$OTOOL_HV_RESULT"; then
            :
          else
            VERIFY_STATUS=1
          fi
          if OTOOL_D_RESULT="$(otool -D "$OUTPUT" 2>&1)"; then :; else VERIFY_STATUS=1; fi
          if OTOOL_L_RESULT="$(otool -L "$OUTPUT" 2>&1)"; then :; else VERIFY_STATUS=1; fi
          if grep -Fq '@rpath/Tiktiger.dylib' <<< "$OTOOL_D_RESULT"; then :; else VERIFY_STATUS=1; fi
          if SYMBOL_RESULT="$(nm -gU "$OUTPUT" 2>&1)"; then :; else VERIFY_STATUS=1; fi
          if SHA256_RESULT="$(shasum -a 256 "$OUTPUT" 2>&1)"; then :; else VERIFY_STATUS=1; fi

          : > "$SYMBOL_STATUS_FILE"
          REQUIRED_SYMBOLS="tt_product_name tt_version tt_runtime_initialize tt_runtime_dylib_loaded tt_runtime_initializer_executed tt_runtime_core_started tt_runtime_feature_registry_ready tt_runtime_mark_ui_registered tt_runtime_mark_ui_presented tt_runtime_ui_registered tt_runtime_ui_presented tt_runtime_diagnostics_json tt_feature_count tt_feature_key_at tt_set_feature_enabled tt_set_download_stage"
          for symbol in $REQUIRED_SYMBOLS; do
            if grep -Eiq "(^|[[:space:]_])${symbol}([[:space:]]|$)" <<< "$SYMBOL_RESULT"; then
              printf '%s: FOUND\n' "$symbol" >> "$SYMBOL_STATUS_FILE"
            else
              printf '%s: FAILED\n' "$symbol" >> "$SYMBOL_STATUS_FILE"
              VERIFY_STATUS=1
            fi
          done

          if test "$VERIFY_STATUS" -eq 0; then
            DYLIB_VERIFIED='YES'
            DYLIB_SYMBOL_STATUS='ALL REQUIRED SYMBOLS FOUND'
          else
            DYLIB_VERIFIED='NO'
            DYLIB_SYMBOL_STATUS='ONE OR MORE REQUIRED CHECKS FAILED'
          fi

          {
            echo 'BUILD STATUS: DYLIB BUILD SUCCEEDED'
            echo "DYLIB BUILD: BUILD SUCCEEDED"
            echo "REAL DYLIB VERIFIED: $DYLIB_VERIFIED"
            echo "DYLIB PRODUCT PATH: $REAL_DYLIB"
            echo 'DYLIB FILE RESULT:'
            printf '%s\n' "$FILE_RESULT"
            echo "DYLIB ARCH: $ARCH_LIST"
            echo 'DYLIB MACH-O TYPE:'
            printf '%s\n' "$OTOOL_HV_RESULT"
            echo 'DYLIB INSTALL NAME:'
            printf '%s\n' "$OTOOL_D_RESULT"
            echo "DYLIB SYMBOL STATUS: $DYLIB_SYMBOL_STATUS"
            echo 'DYLIB SHA256:'
            printf '%s\n' "$SHA256_RESULT"
            echo 'HOST DEVICE BUILD: NOT RUN'
            echo 'HOST SIMULATOR BUILD: NOT RUN'
            echo 'RUNTIME: DEVICE RUNTIME NOT VERIFIED'
            echo 'REMAINING WORK: Host builds and runtime smoke test are pending.'
            echo 'lipo result:'
            printf '%s\n' "$LIPO_RESULT"
            echo 'otool -L:'
            printf '%s\n' "$OTOOL_L_RESULT"
            echo 'exported symbols:'
            printf '%s\n' "$SYMBOL_RESULT"
            echo 'required symbol status:'
            cat "$SYMBOL_STATUS_FILE"
            echo 'SHA-256:'
            printf '%s\n' "$SHA256_RESULT"
          } > "$VERIFICATION"

          if test "$VERIFY_STATUS" -ne 0; then
            echo 'Dylib verification failed; Host build will not use an unverified binary.'
            exit 1
          fi

          cp -f "$REAL_DYLIB" "$OUTPUT_DIR/Tiktiger.dylib"
          test -s "$OUTPUT_DIR/Tiktiger.dylib"
          case "$OUTPUT_DIR/Tiktiger.dylib" in
            *.dSYM/*) echo 'Refusing dSYM output path'; exit 1 ;;
          esac

      - name: Wire verified dylib into TiktigerHost
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/Tiktiger_1.1/Xcode_Dylib_Project"
          HOST_DIR="$GITHUB_WORKSPACE/Tiktiger_1.1/TiktigerHost"
          OUTPUT="$PROJECT_DIR/BuildOutput/Tiktiger.dylib"
          RUNTIME_DIR="$HOST_DIR/TigerHost/Runtime"
          mkdir -p "$RUNTIME_DIR"
          case "$OUTPUT" in
            *.dSYM/*) echo 'Refusing dSYM input'; exit 1 ;;
          esac
          cp -f "$OUTPUT" "$RUNTIME_DIR/Tiktiger.dylib"
          test -s "$RUNTIME_DIR/Tiktiger.dylib"
          file "$RUNTIME_DIR/Tiktiger.dylib"

      - name: Build TiktigerHost for iphoneos
        shell: bash
        run: |
          set -uo pipefail
          HOST_DIR="$GITHUB_WORKSPACE/Tiktiger_1.1/TiktigerHost"
          HOST_PROJECT="$HOST_DIR/TiktigerHost.xcodeproj"
          HOST_DERIVED="$HOST_DIR/Build/.DerivedData"
          HOST_XCODE_STATUS=0
          HOST_EMBED_STATUS=0
          rm -rf "$HOST_DERIVED"
          if xcodebuild \
            -project "$HOST_PROJECT" \
            -scheme TiktigerHost \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$HOST_DERIVED" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee "$GITHUB_WORKSPACE/host_build.log"; then
            :
          else
            HOST_XCODE_STATUS=1
          fi
          if ! grep -q 'BUILD SUCCEEDED' "$GITHUB_WORKSPACE/host_build.log"; then
            HOST_XCODE_STATUS=1
          fi
          if test "$HOST_XCODE_STATUS" -eq 0; then
            HOST_APP="$(find "$HOST_DERIVED/Build/Products" -type d -path '*/Release-iphoneos/TiktigerHost.app' -print -quit)"
            if test -z "$HOST_APP"; then
              HOST_EMBED_STATUS=1
            else
              EMBEDDED_DYLIB="$HOST_APP/Frameworks/Tiktiger.dylib"
              if ! test -f "$EMBEDDED_DYLIB"; then
                mkdir -p "$HOST_APP/Frameworks"
                cp -f "$GITHUB_WORKSPACE/Tiktiger_1.1/Xcode_Dylib_Project/BuildOutput/Tiktiger.dylib" "$EMBEDDED_DYLIB"
                EMBED_MODE='post-build copy from verified BuildOutput'
              else
                EMBED_MODE='Xcode Embed Tiktiger dylib phase'
              fi
              if ! test -s "$EMBEDDED_DYLIB"; then HOST_EMBED_STATUS=1; fi
              test -f "$HOST_APP/Frameworks/Tiktiger.dylib"
              mkdir -p "$GITHUB_WORKSPACE/host_app"
              ditto "$HOST_APP" "$GITHUB_WORKSPACE/host_app/TiktigerHost.app"
              printf 'Host app: %s\nEmbedded dylib: %s\nEmbedding mode: %s\n' "$HOST_APP" "$EMBEDDED_DYLIB" "$EMBED_MODE" > "$GITHUB_WORKSPACE/host_runtime_embedding.txt"
            fi
          fi
          if test "$HOST_XCODE_STATUS" -eq 0; then
            echo 'BUILD SUCCEEDED' > "$GITHUB_WORKSPACE/host_build_status.txt"
          else
            echo 'BUILD FAILED' > "$GITHUB_WORKSPACE/host_build_status.txt"
          fi
          if test "$HOST_EMBED_STATUS" -eq 0; then
            echo 'EMBED SUCCEEDED' > "$GITHUB_WORKSPACE/host_embedding_status.txt"
          else
            echo 'EMBED FAILED' > "$GITHUB_WORKSPACE/host_embedding_status.txt"
          fi

      - name: Build TiktigerHost for iphonesimulator without device dylib
        shell: bash
        run: |
          set -uo pipefail
          HOST_DIR="$GITHUB_WORKSPACE/Tiktiger_1.1/TiktigerHost"
          HOST_PROJECT="$HOST_DIR/TiktigerHost.xcodeproj"
          SIM_DERIVED="$HOST_DIR/Build/.SimulatorDerivedData"
          SIM_STATUS=0
          rm -rf "$SIM_DERIVED"
          if xcodebuild \
            -project "$HOST_PROJECT" \
            -scheme TiktigerHost \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$SIM_DERIVED" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee "$GITHUB_WORKSPACE/simulator_build.log"; then
            :
          else
            SIM_STATUS=1
          fi
          if ! grep -q 'BUILD SUCCEEDED' "$GITHUB_WORKSPACE/simulator_build.log"; then
            SIM_STATUS=1
          fi
          if test "$SIM_STATUS" -eq 0; then
            SIM_APP="$(find "$SIM_DERIVED/Build/Products" -type d -path '*/Debug-iphonesimulator/TiktigerHost.app' -print -quit)"
            if test -z "$SIM_APP"; then
              SIM_STATUS=1
            else
              mkdir -p "$GITHUB_WORKSPACE/simulator_app"
              ditto "$SIM_APP" "$GITHUB_WORKSPACE/simulator_app/TiktigerHost.app"
              printf 'Simulator app: %s\n' "$SIM_APP" > "$GITHUB_WORKSPACE/simulator_app_path.txt"
            fi
          fi
          if test "$SIM_STATUS" -eq 0; then
            echo 'BUILD SUCCEEDED' > "$GITHUB_WORKSPACE/simulator_build_status.txt"
          else
            echo 'BUILD FAILED' > "$GITHUB_WORKSPACE/simulator_build_status.txt"
          fi

      - name: Runtime smoke test on iOS Simulator
        if: ${{ success() }}
        shell: bash
        run: |
          set -uo pipefail
          SMOKE_STATUS=0
          SMOKE_LOG="$GITHUB_WORKSPACE/runtime_console.log"
          SMOKE_REPORT="$GITHUB_WORKSPACE/runtime_smoke_test.txt"
          SCREENSHOT="$GITHUB_WORKSPACE/runtime_screenshot.png"
          : > "$SMOKE_LOG"
          : > "$SMOKE_REPORT"
          if test "$(cat "$GITHUB_WORKSPACE/host_build_status.txt" 2>/dev/null || echo FAILED)" != 'BUILD SUCCEEDED'; then SMOKE_STATUS=1; fi
          if test "$(cat "$GITHUB_WORKSPACE/simulator_build_status.txt" 2>/dev/null || echo FAILED)" != 'BUILD SUCCEEDED'; then SMOKE_STATUS=1; fi
          DEVICE_ID="$(xcrun simctl list devices available | sed -nE 's/.*\\(([0-9A-F-]{36})\\).*/\\1/p' | sed -n '1p')"
          if test -z "$DEVICE_ID"; then
            SMOKE_STATUS=1
            echo 'SIMULATOR DEVICE: NOT FOUND' >> "$SMOKE_REPORT"
          else
            xcrun simctl boot "$DEVICE_ID" >/dev/null 2>&1 || true
            if xcrun simctl bootstatus "$DEVICE_ID" -b >> "$SMOKE_LOG" 2>&1; then
              echo "SIMULATOR DEVICE: $DEVICE_ID BOOTED" >> "$SMOKE_REPORT"
            else
              SMOKE_STATUS=1
              echo "SIMULATOR DEVICE: $DEVICE_ID BOOT FAILED" >> "$SMOKE_REPORT"
            fi
            if xcrun simctl install "$DEVICE_ID" "$GITHUB_WORKSPACE/simulator_app/TiktigerHost.app" >> "$SMOKE_LOG" 2>&1; then
              echo 'APP INSTALL: SUCCEEDED' >> "$SMOKE_REPORT"
            else
              SMOKE_STATUS=1
              echo 'APP INSTALL: FAILED' >> "$SMOKE_REPORT"
            fi
            if xcrun simctl launch "$DEVICE_ID" com.ucorc.Tiktiger >> "$SMOKE_LOG" 2>&1; then
              echo 'UI LAUNCH: SUCCEEDED' >> "$SMOKE_REPORT"
            else
              SMOKE_STATUS=1
              echo 'UI LAUNCH: FAILED' >> "$SMOKE_REPORT"
            fi
            sleep 5
            if xcrun simctl io "$DEVICE_ID" screenshot "$SCREENSHOT" >> "$SMOKE_LOG" 2>&1; then
              echo 'UI SCREENSHOT: CAPTURED' >> "$SMOKE_REPORT"
            else
              SMOKE_STATUS=1
              echo 'UI SCREENSHOT: FAILED' >> "$SMOKE_REPORT"
            fi
            xcrun simctl spawn "$DEVICE_ID" log show --last 2m --style compact --predicate 'process == "TiktigerHost"' >> "$SMOKE_LOG" 2>&1 || true
            if grep -Eiq 'Device-only Tiktiger.dylib load skipped|simulator_device_load' "$SMOKE_LOG"; then
              echo 'SIMULATOR GUARD MILESTONE: VERIFIED — device dylib load skipped' >> "$SMOKE_REPORT"
            else
              echo 'SIMULATOR GUARD MILESTONE: NOT CAPTURED' >> "$SMOKE_REPORT"
            fi
          fi
          {
            echo 'RUNTIME SMOKE TEST: SIMULATOR ONLY'
            cat "$SMOKE_REPORT"
            echo 'DEVICE DYLIB LOADED: NOT VERIFIED — simulator guard intentionally skips device dylib'
            echo 'INITIALIZER EXECUTED: NOT VERIFIED on simulator'
            echo 'CORE STARTED: NOT VERIFIED on simulator'
            echo 'FEATURE REGISTRY READY: NOT VERIFIED on simulator'
            echo 'UI REGISTERED: UI launch/screenshot exercised; Host hierarchy milestone not claimed from log alone'
            echo 'UI PRESENTED: NOT VERIFIED by Host hierarchy probe'
          } > "$SMOKE_REPORT.tmp"
          mv "$SMOKE_REPORT.tmp" "$SMOKE_REPORT"
          if test "$SMOKE_STATUS" -ne 0; then
            echo 'FAILED' > "$GITHUB_WORKSPACE/runtime_smoke_status.txt"
            exit 1
          fi
          echo 'SUCCEEDED' > "$GITHUB_WORKSPACE/runtime_smoke_status.txt"

      - name: Finalize verification and enforce build status
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          VERIFICATION="$GITHUB_WORKSPACE/verification.txt"
          HOST_STATUS='NOT RUN'
          SIM_STATUS='NOT RUN'
          if test -f "$GITHUB_WORKSPACE/host_build_status.txt"; then HOST_STATUS="$(cat "$GITHUB_WORKSPACE/host_build_status.txt")"; fi
          if test -f "$GITHUB_WORKSPACE/simulator_build_status.txt"; then SIM_STATUS="$(cat "$GITHUB_WORKSPACE/simulator_build_status.txt")"; fi
          {
            echo "HOST DEVICE BUILD: $HOST_STATUS"
            if test -f "$GITHUB_WORKSPACE/host_embedding_status.txt"; then echo "HOST DYLIB EMBEDDING: $(cat "$GITHUB_WORKSPACE/host_embedding_status.txt")"; fi
            echo "HOST SIMULATOR BUILD: $SIM_STATUS"
            echo 'RUNTIME: SIMULATOR SMOKE TEST RECORDED; DEVICE RUNTIME NOT VERIFIED'
            echo 'Runtime milestones: NOT CAPTURED in build-only job; simulator smoke test is separate'
            echo 'Runtime milestones: DEVICE DYLIB/CORE/REGISTRY/UI HIERARCHY NOT VERIFIED on simulator due device-only load guard'
            if test -f "$GITHUB_WORKSPACE/runtime_smoke_test.txt"; then
              echo 'Runtime smoke report:'
              cat "$GITHUB_WORKSPACE/runtime_smoke_test.txt"
            fi
            echo 'REMAINING WORK: Real-device runtime smoke test with Host Console milestones and view-hierarchy confirmation.'
          } >> "$VERIFICATION"
          HOST_EMBED_STATUS='EMBED FAILED'
          if test -f "$GITHUB_WORKSPACE/host_embedding_status.txt"; then HOST_EMBED_STATUS="$(cat "$GITHUB_WORKSPACE/host_embedding_status.txt")"; fi
          SMOKE_STATUS='NOT RUN'
          if test -f "$GITHUB_WORKSPACE/runtime_smoke_status.txt"; then SMOKE_STATUS="$(cat "$GITHUB_WORKSPACE/runtime_smoke_status.txt")"; fi
          echo "RUNTIME SMOKE STATUS: $SMOKE_STATUS" >> "$VERIFICATION"
          if test "$HOST_STATUS" = 'BUILD SUCCEEDED' && test "$HOST_EMBED_STATUS" = 'EMBED SUCCEEDED' && test "$SIM_STATUS" = 'BUILD SUCCEEDED' && test "$SMOKE_STATUS" = 'SUCCEEDED'; then
            exit 0
          fi
          exit 1

      - name: Upload Tiktiger artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Tiktiger-1.1-ios-arm64-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            Tiktiger_1.1/Xcode_Dylib_Project/BuildOutput/Tiktiger.dylib
            build.log
            host_build.log
            simulator_build.log
            verification.txt
            symbol_status.txt
            host_runtime_embedding.txt
            host_embedding_status.txt
            dylib_product_path.txt
            host_build_status.txt
            simulator_build_status.txt
            simulator_app/TiktigerHost.app
            simulator_app_path.txt
            runtime_smoke_test.txt
            runtime_console.log
            runtime_screenshot.png
            runtime_smoke_status.txt
